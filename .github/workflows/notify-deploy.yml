# Reports every website deploy to the ops Slack channel.
#
# This site is published by GitHub Pages' own `pages build and deployment`
# workflow, which is generated by GitHub and cannot be edited — so there is
# nowhere to add a notify step. This listens for that workflow finishing
# instead, then checks the live site and says what happened.
#
# One line per successful deploy, on purpose: a heartbeat means silence on a day
# main moved is itself a signal, the same way oryjin-tech/core reports its own
# deploys into the same channel.
#
# Validating a change to this file takes a real push to main: `workflow_dispatch`
# exercises the smoke test and the webhook, but not the `workflow_run` trigger
# below, which is the part that carries the whole thing.
#
# The workflow this listens for has two different names, and picking the wrong
# one fails silently — no run, no error, just nothing. Runs of it are titled
# "pages build and deployment", but the workflow's own name, which is what the
# `workflows:` filter matches on, is "pages-build-deployment". Confirm with:
#
#   gh api repos/oryjin-tech/website/actions/workflows --jq '.workflows[].name'
name: Notify deploy

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  # The workflow_run path cannot be triggered by hand, so this exists to
  # exercise the smoke test and the webhook without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

# Deploys are rare and sequential; queueing rather than cancelling keeps the
# heartbeat honest if two land back to back.
concurrency:
  group: notify-deploy
  cancel-in-progress: false

jobs:
  notify:
    # Pages runs on pushes to main only, but the event also fires for runs that
    # were cancelled or skipped — neither is a deploy, and neither is news.
    if: >
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.conclusion != 'cancelled'
          && github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    env:
      SLACK_OPS_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
      SITE_URL: https://oryjin.com
      # Everything below goes through env rather than being interpolated into a
      # `run:` body — a commit subject is untrusted text and has no business
      # being pasted into a shell command.
      RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual run' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
      TITLE: ${{ github.event.workflow_run.display_title || 'manual check, no deploy' }}

    steps:
      - name: Check out the scripts
        uses: actions/checkout@v4

      # Nothing was published, so there is nothing to smoke: the previous commit
      # is still what oryjin.com serves. The job stays green — the Pages run is
      # already red, and a second red check on the same failure only makes the
      # notifier's own breakages harder to spot.
      - name: Report a failed Pages build
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: >
          ./scripts/notify-slack.sh
          "❌ Website deploy: the Pages build for ${SHA:0:7} ended with
          $CONCLUSION — oryjin.com is still serving the previous version.
          $RUN_URL"

      - name: Smoke the live site
        id: smoke
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        env:
          SMOKE_CACHE_BUSTER: ${{ github.run_id }}
        run: ./scripts/smoke-site.sh "$SITE_URL"

      - name: Notify success
        if: success() && steps.smoke.outcome == 'success'
        run: >
          ./scripts/notify-slack.sh
          "✅ Website deploy: ${SHA:0:7} is live on $SITE_URL — \"$TITLE\"
          ($ACTOR). $RUN_URL"

      # Pages published the commit and then the site did not come back. There is
      # no revert to reach for here — Pages serves whatever is on main, so
      # recovering means pushing a fix or reverting the commit by hand.
      - name: Notify a live-site failure
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          REASON: ${{ steps.smoke.outputs.reason }}
        run: >
          ./scripts/notify-slack.sh
          "🚨 Website deploy: Pages published ${SHA:0:7} but the live site did
          not come back healthy — ${REASON:-see the run log}. $RUN_URL"
