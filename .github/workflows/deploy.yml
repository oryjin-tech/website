# Publishes oryjin.com. GitHub Pages deploys from GitHub Actions since
# 2026-10-17 (Settings → Pages → Source). The site is an Astro build: the
# hand-written pages in public/ are copied as-is, the guides and the hub are
# generated from src/ (oryjin-tech/core, docs/plans/payment-knowledge-hub.md).
#
# The SEO gate (scripts/check-site.mjs) runs before the upload, so a build
# that drops a published URL or ships a broken link never goes live.
#
# notify-deploy.yml listens for this workflow's name, "Deploy". Renaming it
# silently stops the Slack heartbeat.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a deploy in flight is never cancelled half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: SEO gate
        run: pnpm check:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
